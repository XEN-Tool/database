<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XEN DB Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f1f1; --bg2:#ffffff; --card:#ffffff; --border:#dcdcdc;
    --text:#121212; --muted:#6a6a6a; --accent:#2b2b2b; --accent2:#6e6e6e; --onaccent:#ffffff;
    --radius:16px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0a0a0a; --bg2:#121212; --card:#161616; --border:#2e2e2e80;
      --text:#f2f2f2; --muted:#9a9a9a; --accent:#e6e6e6; --accent2:#8a8a8a; --onaccent:#0a0a0a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0a0a; --bg2:#121212; --card:#161616; --border:#2e2e2e80;
    --text:#f2f2f2; --muted:#9a9a9a; --accent:#e6e6e6; --accent2:#8a8a8a; --onaccent:#0a0a0a;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
    background-image:
      radial-gradient(circle at 15% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 55%),
      radial-gradient(circle at 85% 20%, color-mix(in srgb, var(--accent2) 10%, transparent), transparent 50%);
    min-height:100%;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; margin:0;}
  .wrap{max-width:980px; margin:0 auto; padding:0 20px 60px;}
  header{display:flex; align-items:center; justify-content:space-between; padding:22px 0; flex-wrap:wrap; gap:10px;}
  .logo{display:flex; align-items:center; gap:10px; font-family:'Space Grotesk'; font-weight:700; font-size:18px;}
  .logo a{color:inherit; text-decoration:none; display:flex; align-items:center; gap:10px;}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));}
  .head-actions{display:flex; gap:10px; flex-wrap:wrap;}
  .btn{display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:999px; font-weight:600; font-size:13px; text-decoration:none; border:1px solid var(--border); cursor:pointer; color:var(--text); background:color-mix(in srgb, var(--card) 70%, transparent); font-family:inherit;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:var(--onaccent); border:none;}
  .hero{padding:20px 0 10px; text-align:center;}
  .hero h1{font-size:clamp(26px,4.5vw,40px); letter-spacing:-0.02em;}
  .hero .accent{background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hero p{color:var(--muted); max-width:560px; margin:12px auto 24px; font-size:15px; line-height:1.6;}
  .search-wrap{max-width:560px; margin:0 auto 28px; position:relative;}
  .search-wrap input{
    width:100%; padding:16px 48px 16px 20px; border-radius:999px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:15px; font-family:inherit; outline:none;
  }
  .search-wrap input:focus{border-color:var(--accent);}
  .search-wrap .icon{position:absolute; right:18px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none;}
  .overview{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; max-width:560px; margin:0 auto 28px;}
  .overview .stat{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center;}
  .overview .v{font-family:'Space Grotesk'; font-size:22px; font-weight:700;}
  .overview .l{color:var(--muted); font-size:12px; margin-top:2px;}
  .add-row{text-align:center; margin-bottom:24px;}
  section.panel{background:var(--card); border:1px solid var(--border); border-radius:20px; padding:24px; margin-bottom:24px;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:18px;}
  .panel-head h2{font-size:18px;}
  .panel-head span{color:var(--muted); font-size:13px;}
  .tabs{display:flex; gap:8px; flex-wrap:wrap; border-bottom:1px solid var(--border); padding-bottom:14px; margin-bottom:18px;}
  .tab{padding:8px 16px; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--muted); font-weight:600; font-size:13px; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:6px;}
  .tab .count{font-size:11px; opacity:.75;}
  .tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:var(--onaccent); border-color:transparent;}
  .file-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px; border:1px solid var(--border); border-radius:12px; margin-bottom:10px; flex-wrap:wrap;}
  .file-left{display:flex; align-items:center; gap:12px;}
  .file-icon{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb, var(--accent2) 16%, transparent); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .file-name{font-weight:600; font-size:14px;}
  .file-meta{color:var(--muted); font-size:12px; margin-top:2px;}
  .badge{display:inline-block; font-size:11px; font-weight:600; color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); padding:2px 8px; border-radius:999px; margin-right:6px;}
  .file-actions{display:flex; gap:8px; flex-shrink:0;}
  .dl{padding:9px 16px; border-radius:999px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:var(--onaccent); font-size:13px; font-weight:700; text-decoration:none;}
  .copy,.del{padding:9px 14px; border-radius:999px; background:var(--bg2); border:1px solid var(--border); color:var(--text); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;}
  .del{color:#c0392b;}
  .empty{text-align:center; color:var(--muted); padding:30px 10px; font-size:14px; line-height:1.6;}
  footer{text-align:center; padding:10px 0 40px; color:var(--muted); font-size:13px;}
  footer a{color:var(--accent);}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .overlay.hidden{display:none;}
  .modal{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:24px; max-width:420px; width:100%;}
  .modal h3{font-size:17px; margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input{width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg2); color:var(--text); font-family:inherit; font-size:14px; outline:none;}
  .field input:focus{border-color:var(--accent);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px; justify-content:flex-end;}
  .admin-link{position:fixed; bottom:16px; right:16px; font-size:11px; color:var(--muted); background:var(--card); border:1px solid var(--border); padding:6px 12px; border-radius:999px; cursor:pointer; opacity:.6; z-index:10;}
  .admin-link:hover{opacity:1;}
  .login-error{color:#c0392b; font-size:12px; margin-top:-4px; margin-bottom:10px; display:none;}
  .admin-badge{font-size:11px; color:var(--muted); margin-left:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><a href="https://claude.ai/artifact/X8tzSVH44sfr9RZRhmM6HH"><span class="dot"></span>XEN Database</a></div>
    <div class="head-actions">
      <a class="btn" href="https://discord.gg/l2d" target="_blank" rel="noopener">Discord</a>
    </div>
  </header>

  <div class="hero">
    <h1>Parcourir les <span class="accent">bases de données</span></h1>
    <p>Chaque base ajoutée apparaît instantanément ici pour tous les visiteurs, classée par catégorie, avec son lien de téléchargement direct.</p>
  </div>

  <div class="search-wrap">
    <input id="search" type="text" placeholder="Rechercher une base de données...">
    <span class="icon">🔍</span>
  </div>

  <div class="overview" id="overview"></div>
  <div class="add-row" id="add-row"></div>

  <section class="panel">
    <div class="panel-head">
      <h2 id="panel-title">Catégories</h2>
      <span id="panel-sub"></span>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="files"></div>
  </section>

  <footer>
    XEN Database · <a href="https://discord.gg/l2d" target="_blank" rel="noopener">discord.gg/l2d</a>
  </footer>
</div>

<div class="overlay hidden" id="overlay">
  <div class="modal">
    <h3>Ajouter une base</h3>
    <div class="field"><label>Catégorie</label><input id="f-cat" placeholder="Ex: Sécurité"></div>
    <div class="field"><label>Nom de la base</label><input id="f-title" placeholder="Ex: Dessin animé"></div>
    <div class="field"><label>Lien de téléchargement</label><input id="f-url" placeholder="https://..."></div>
    <div class="field-row">
      <div class="field"><label>Lignes (optionnel)</label><input id="f-lines" type="number" placeholder="—"></div>
      <div class="field"><label>Taille en Mo (optionnel)</label><input id="f-size" type="number" placeholder="—"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="submitEntry()">Ajouter</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="login-overlay">
  <div class="modal">
    <h3>Connexion admin</h3>
    <div class="field"><label>Identifiant</label><input id="l-user" autocomplete="off"></div>
    <div class="field"><label>Mot de passe</label><input id="l-pass" type="password"></div>
    <div class="login-error" id="l-error">Identifiants incorrects.</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeLogin()">Annuler</button>
      <button class="btn btn-primary" onclick="attemptLogin()">Se connecter</button>
    </div>
  </div>
</div>
<button class="admin-link" id="admin-link" onclick="openLogin()">Admin</button>

<script>
const ADMIN_HASH = '440c33c1b7f6f6699ac136d7102ad53dcc5c4697805720338c17607f68fa2c18';
let adminUnlocked = false;

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
function openLogin(){ document.getElementById('login-overlay').classList.remove('hidden'); }
function closeLogin(){
  document.getElementById('login-overlay').classList.add('hidden');
  document.getElementById('l-error').style.display = 'none';
  document.getElementById('l-user').value = '';
  document.getElementById('l-pass').value = '';
}
async function attemptLogin(){
  const u = document.getElementById('l-user').value.trim();
  const p = document.getElementById('l-pass').value;
  const hash = await sha256(`${u}:${p}`);
  if(hash === ADMIN_HASH){
    adminUnlocked = true;
    closeLogin();
    document.getElementById('admin-link').style.display = 'none';
    render();
  } else {
    document.getElementById('l-error').style.display = 'block';
  }
}

let entries = [];
let active = 'Toutes';
let isRealOwner = false;
let dbRef = null;
function canWrite(){ return isRealOwner && adminUnlocked; }

function formatSize(bytes){
  if(bytes >= 1_000_000_000) return (bytes/1_000_000_000).toFixed(2)+" GB";
  if(bytes >= 1_000_000) return (bytes/1_000_000).toFixed(2)+" MB";
  if(bytes >= 1_000) return (bytes/1_000).toFixed(2)+" KB";
  return bytes+" B";
}
function formatGB(bytes){ return (bytes/1_000_000_000).toFixed(3)+" GB"; }
function formatLines(n){ return n.toLocaleString('fr-FR'); }

const overviewEl = document.getElementById('overview');
const addRowEl = document.getElementById('add-row');
const tabsEl = document.getElementById('tabs');
const filesEl = document.getElementById('files');
const titleEl = document.getElementById('panel-title');
const subEl = document.getElementById('panel-sub');
const searchEl = document.getElementById('search');
const overlayEl = document.getElementById('overlay');

function categories(){
  return [...new Set(entries.map(e=>e.category))];
}

function entryCard(e){
  const metaParts = [];
  if(e.lines != null) metaParts.push(formatLines(e.lines)+" lignes");
  if(e.sizeBytes != null) metaParts.push(formatSize(e.sizeBytes)+" ("+formatGB(e.sizeBytes)+")");
  const meta = metaParts.length ? metaParts.join(' · ') : 'Lignes / taille non renseignées';
  return `
    <div class="file-row">
      <div class="file-left">
        <div class="file-icon">🗂️</div>
        <div>
          <div class="file-name">${active==='Toutes' ? `<span class="badge">${e.category}</span>` : ''}${e.title}</div>
          <div class="file-meta">${meta}</div>
        </div>
      </div>
      <div class="file-actions">
        ${e.downloadUrl ? `<button class="copy" onclick="copyLink('${e.downloadUrl.replace(/'/g,"\\'")}', this)">Copier</button>` : ''}
        ${e.downloadUrl ? `<a class="dl" href="${e.downloadUrl}" target="_blank" rel="noopener">Télécharger</a>` : ''}
        ${canWrite() ? `<button class="del" onclick="removeEntry('${e.id}')">✕</button>` : ''}
      </div>
    </div>
  `;
}

function copyLink(url, btn){
  navigator.clipboard?.writeText(url).then(()=>{
    const old = btn.textContent;
    btn.textContent = 'Copié !';
    setTimeout(()=>{ btn.textContent = old; }, 1500);
  }).catch(()=>{});
}

function renderOverview(){
  const cats = categories();
  overviewEl.innerHTML = `
    <div class="stat"><div class="v">${entries.length}</div><div class="l">Base${entries.length>1?'s':''}</div></div>
    <div class="stat"><div class="v">${cats.length}</div><div class="l">Catégorie${cats.length>1?'s':''}</div></div>
  `;
}

function renderAddRow(){
  addRowEl.innerHTML = canWrite()
    ? `<button class="btn btn-primary" onclick="openModal()">+ Ajouter une base</button>`
    : '';
}

function renderTabs(){
  const cats = categories();
  tabsEl.innerHTML = '';
  if(cats.length === 0){ tabsEl.style.display = 'none'; return; }
  tabsEl.style.display = 'flex';
  const allBtn = document.createElement('button');
  allBtn.className = 'tab' + (active==='Toutes' ? ' active' : '');
  allBtn.innerHTML = `Toutes <span class="count">${entries.length}</span>`;
  allBtn.onclick = ()=>{ active='Toutes'; render(); };
  tabsEl.appendChild(allBtn);
  cats.forEach(cat=>{
    const count = entries.filter(e=>e.category===cat).length;
    const b = document.createElement('button');
    b.className = 'tab' + (cat===active ? ' active' : '');
    b.innerHTML = `${cat} <span class="count">${count}</span>`;
    b.onclick = ()=>{ active=cat; render(); };
    tabsEl.appendChild(b);
  });
}

function render(){
  renderOverview();
  renderAddRow();
  renderTabs();

  const q = searchEl.value.trim().toLowerCase();
  let list = entries;
  if(q){
    list = entries.filter(e => e.title.toLowerCase().includes(q) || e.category.toLowerCase().includes(q));
    titleEl.textContent = `Résultats pour "${searchEl.value}"`;
  } else if(active === 'Toutes'){
    titleEl.textContent = 'Toutes les bases';
  } else {
    list = entries.filter(e => e.category === active);
    titleEl.textContent = active;
  }
  subEl.textContent = `${list.length} base${list.length>1?'s':''}`;

  if(entries.length === 0){
    filesEl.innerHTML = `<div class="empty">Aucune base pour le moment.${canWrite() ? '<br>Clique sur « + Ajouter une base » pour commencer.' : ''}</div>`;
    return;
  }
  filesEl.innerHTML = list.length
    ? list.map(entryCard).join('')
    : '<div class="empty">Aucun résultat.</div>';
}

function openModal(){ overlayEl.classList.remove('hidden'); }
function closeModal(){
  overlayEl.classList.add('hidden');
  ['f-cat','f-title','f-url','f-lines','f-size'].forEach(id=> document.getElementById(id).value = '');
}

async function submitEntry(){
  if(!dbRef) return;
  const category = document.getElementById('f-cat').value.trim();
  const title = document.getElementById('f-title').value.trim();
  const downloadUrl = document.getElementById('f-url').value.trim();
  const linesVal = document.getElementById('f-lines').value;
  const sizeVal = document.getElementById('f-size').value;
  if(!category || !title || !downloadUrl) return;
  const data = { category, title, downloadUrl, createdAt: new Date().toISOString() };
  if(linesVal !== '') data.lines = Number(linesVal);
  if(sizeVal !== '') data.sizeBytes = Math.round(Number(sizeVal) * 1_000_000);
  try{
    await dbRef.collection('entries').add(data);
    closeModal();
  }catch(err){ /* write rejected: viewer likely lacks permission */ }
}

async function removeEntry(id){
  if(!dbRef) return;
  try{ await dbRef.collection('entries').doc(id).delete(); }catch(err){}
}

searchEl.addEventListener('input', render);

(async function init(){
  const db = await claude.use('db');
  const user = await claude.use('user');
  dbRef = db;
  isRealOwner = !!(user && user.isOwner?.());
  if(!isRealOwner){ document.getElementById('admin-link').style.display = 'none'; }
  if(!db){
    filesEl.innerHTML = '<div class="empty">Impossible de charger les bases pour le moment.</div>';
    return;
  }
  db.collection('entries').onSnapshot((snap)=>{
    entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, ()=>{});
})();
</script>
</body>
</html>
